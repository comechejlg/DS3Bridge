<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9FF"/>
      <stop offset="1" stop-color="#E4EBFF"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#16247A"/>
    </linearGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="268" y1="0" x2="362" y2="0">
      <stop offset="0" stop-color="#8FB3FF"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <!-- header band -->
  <rect width="640" height="86" fill="url(#band)"/>
  <g fill="none" stroke="#8FD8FF" stroke-linecap="round" stroke-width="4">
    <path d="M 586 40 A 12 12 0 0 1 604 40"/>
    <path d="M 579 33 A 22 22 0 0 1 611 33" opacity="0.75"/>
    <path d="M 572 26 A 32 32 0 0 1 618 26" opacity="0.5"/>
  </g>
  <text x="40" y="47" font-family="Inter Display, Inter, Helvetica Neue, Arial" font-weight="700" font-size="30" fill="#FFFFFF" letter-spacing="0.3">DS3Bridge</text>
  <text x="41" y="69" font-family="Inter, Helvetica Neue, Arial" font-weight="500" font-size="13" fill="#C9D8FF">DualShock 3 over Bluetooth on macOS</text>

  <!-- drop zone hints under the two icons (icons sit at x=170 and x=470, y=188) -->
  <circle cx="170" cy="188" r="80" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="470" cy="188" r="80" fill="#FFFFFF" opacity="0.7"/>

  <!-- arrow -->
  <g>
    <path d="M 268 188 L 362 188" stroke="url(#arrow)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 350 172 L 370 188 L 350 204" stroke="#2F6BFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="320" y="224" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial" font-weight="600" font-size="13" fill="#2A3F8F">Drag to Applications</text>

  <!-- footer -->
  <rect x="0" y="292" width="640" height="108" fill="#FFFFFF" opacity="0.55"/>
  <text x="320" y="318" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial" font-weight="500" font-size="12" fill="#34437A">First launch: if macOS blocks it, open System Settings › Privacy &amp; Security › Open Anyway.</text>
  <text x="320" y="337" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial" font-weight="500" font-size="12" fill="#5A6796">Then open DS3Bridge and choose Setup to pair your controller.</text>
</svg>
