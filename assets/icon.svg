<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#16247A"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE5FF"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000820" flood-opacity="0.35"/>
    </filter>
    <filter id="tileshadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <!-- controller silhouette with the details cut out -->
    <mask id="padmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="black"/>
      <g fill="white">
        <rect x="212" y="410" width="600" height="230" rx="115"/>
        <ellipse cx="300" cy="650" rx="92" ry="138" transform="rotate(22 300 650)"/>
        <ellipse cx="724" cy="650" rx="92" ry="138" transform="rotate(-22 724 650)"/>
      </g>
      <g fill="black">
        <!-- d-pad -->
        <rect x="282" y="507" width="104" height="34" rx="9"/>
        <rect x="317" y="472" width="34" height="104" rx="9"/>
        <!-- face buttons -->
        <circle cx="702" cy="478" r="19"/>
        <circle cx="745" cy="524" r="19"/>
        <circle cx="702" cy="570" r="19"/>
        <circle cx="659" cy="524" r="19"/>
        <!-- sticks -->
        <circle cx="430" cy="600" r="40"/>
        <circle cx="594" cy="600" r="40"/>
      </g>
      <g fill="white">
        <circle cx="430" cy="600" r="22"/>
        <circle cx="594" cy="600" r="22"/>
      </g>
    </mask>
  </defs>

  <!-- macOS-style rounded tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#tileshadow)"/>
  <!-- soft highlight -->
  <rect x="100" y="100" width="824" height="460" fill="url(#hl)" clip-path="url(#tile)"/>

  <!-- wireless arcs -->
  <g fill="none" stroke="#8FD8FF" stroke-linecap="round" stroke-width="28">
    <path d="M 462 352 A 70 70 0 0 1 562 352" opacity="1"/>
    <path d="M 420 312 A 130 130 0 0 1 604 312" opacity="0.8"/>
    <path d="M 378 272 A 190 190 0 0 1 646 272" opacity="0.55"/>
  </g>

  <!-- controller -->
  <g filter="url(#shadow)">
    <rect width="1024" height="1024" fill="url(#pad)" mask="url(#padmask)"/>
  </g>
</svg>
